<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dile-highlight-mixin demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .demo-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .proxy {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px dashed #d0d7de;
      border-radius: 12px;
      background: #f6f8fa;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Mixin dile-highlight-mixin demo</h1>

    <div class="demo-actions">
      <button id="focus-card" type="button">Highlight card</button>
      <button id="focus-target" type="button">Highlight inner target</button>
      <button id="toggle-reveal" type="button">Reveal and highlight new block</button>
    </div>
    <p id="status-log">Card has its own box-shadow: it should stay visible during the glow and not jump at the end.</p>

    <highlight-card-demo></highlight-card-demo>

    <br>
    <footer><a href="../index.html">Back</a></footer>
  </div>

  <script type="module">
    import { LitElement, html, css } from 'lit';
    import { DileHighlightMixin } from '@dile/ui/mixins/highlight/index.js';

    class HighlightCardDemo extends DileHighlightMixin(LitElement) {
      static styles = css`
        :host {
          display: block;
          --dile-highlight-color: #2f6fed;
          --dile-highlight-duration: 1.4s;
          margin-top: 1rem;
          padding: 1.25rem;
          border: 1px solid #d0d7de;
          border-radius: 14px;
          background: white;
          box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        .status {
          display: inline-block;
          padding: 0.4rem 0.75rem;
          margin-bottom: 0.9rem;
          border-radius: 999px;
          background: #eef4ff;
          color: #234ca8;
          font-size: 0.8rem;
          font-weight: 700;
        }

        .target {
          padding: 0.8rem 1rem;
          border: 1px solid #b9d1ff;
          border-radius: 10px;
          background: #f8fbff;
          font-weight: 600;
        }

        .revealed {
          margin-top: 0.9rem;
          padding: 0.8rem 1rem;
          border: 1px solid #f3b4b6;
          border-radius: 10px;
          background: #fff7f7;
          box-shadow: 0 4px 10px rgba(229, 72, 77, 0.2);
          --dile-highlight-color: #e5484d;
          --dile-highlight-size: 3px;
        }
      `;

      static properties = {
        revealed: { type: Boolean },
      };

      constructor() {
        super();
        this.revealed = false;
        this._targetSelector = null;
      }

      get highlightTarget() {
        return this._targetSelector ? this.shadowRoot.querySelector(this._targetSelector) : this;
      }

      // highlight() reads highlightTarget after awaiting the render, so the selector
      // must stay set until the returned promise resolves.
      async highlightPart(selector, options) {
        this._targetSelector = selector;
        try {
          return await this.highlight(options);
        } finally {
          this._targetSelector = null;
        }
      }

      highlightInner() {
        return this.highlightPart('.target', { scroll: false });
      }

      revealAndHighlight() {
        this.revealed = true;
        return this.highlightPart('.revealed', { scroll: { block: 'nearest' } });
      }

      render() {
        return html`
          <span class="status">Needs attention</span>
          <div class="target">This inner block gets the glow</div>
          ${this.revealed ? html`<div class="revealed">Rendered right before highlight() was called</div>` : ''}
        `;
      }
    }

    customElements.define('highlight-card-demo', HighlightCardDemo);

    const demo = document.querySelector('highlight-card-demo');

    const log = document.getElementById('status-log');
    const report = async (promise) => {
      const animation = await promise;
      log.textContent = animation ? 'Highlight running…' : 'Nothing to highlight';
      await animation?.finished.catch(() => {});
      if (animation?.playState === 'finished') log.textContent = 'Highlight finished';
    };

    document.getElementById('focus-card').addEventListener('click', () => {
      report(demo.highlight());
    });

    document.getElementById('focus-target').addEventListener('click', () => {
      report(demo.highlightInner());
    });

    document.getElementById('toggle-reveal').addEventListener('click', () => {
      demo.revealed = false;
      report(demo.revealAndHighlight());
    });
  </script>
</body>

</html>
