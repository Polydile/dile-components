<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dile-select-search component demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module">
    import "@dile/ui/components/select/select-search.js";
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    p {
      margin: 10px;
    }
    dile-select-search.styled {
      --dile-input-background-color: #fef6d8;
      --dile-input-border-color: #c90;
      --dile-select-overlay-highlighted-background-color: #fde9a6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>dile-select-search component</h1>
    <p>
      Searchable select with a fixed set of options declared in a slotted native <code>select</code>.
      Same UI as <a href="./dile-select-ajax-overlay.html">dile-select-ajax-overlay</a>, but filtering locally.
    </p>

    <h2>Phone prefix</h2>
    <dile-select-search id="select1" name="prefix" label="Phone prefix" placeholder="Type a prefix or a country...">
      <select slot="select">
        <option value="+34">+34 España</option>
        <option value="+351">+351 Portugal</option>
        <option value="+33">+33 France</option>
        <option value="+39">+39 Italia</option>
        <option value="+44">+44 United Kingdom</option>
        <option value="+49">+49 Deutschland</option>
        <option value="+52">+52 México</option>
        <option value="+54">+54 Argentina</option>
        <option value="+55">+55 Brasil</option>
        <option value="+1">+1 United States, Canada</option>
      </select>
    </dile-select-search>
    <div id="msg1"></div>
    <div id="msg2"></div>
    <script>
      const select1 = document.querySelector('#select1');
      select1.addEventListener('element-changed', (e) => {
        document.querySelector('#msg1').innerHTML = `Selected value: ${e.detail.value}`;
      });
      select1.addEventListener('dile-select-search-selected-text-changed', (e) => {
        document.querySelector('#msg2').innerHTML = `Selected text: ${e.detail.selectedText}`;
      });
    </script>

    <h2>Show all options on focus</h2>
    <dile-select-search showAllOnFocus label="Language" placeholder="Choose a language...">
      <select slot="select">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="pt">Português</option>
      </select>
    </dile-select-search>

    <h2>Initialized via value</h2>
    <dile-select-search value="fr" label="Language">
      <select slot="select">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </dile-select-search>

    <h2>Disabled</h2>
    <dile-select-search disabled>
      <select slot="select">
        <option value="es">Español</option>
      </select>
    </dile-select-search>

    <h2>Styled</h2>
    <dile-select-search class="styled" label="Language" showAllOnFocus>
      <select slot="select">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </dile-select-search>

    <h2>Errored</h2>
    <dile-select-search errored message="This field is required" hideErrorOnInput label="Language">
      <select slot="select">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </dile-select-search>

    <!-- Spacer so the popups above have room to open downward. -->
    <div style="height: 300px;"></div>

    <footer><a href="../index.html">Back</a></footer>
  </div>
</body>
</html>
