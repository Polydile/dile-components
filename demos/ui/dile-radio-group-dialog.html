<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dile-radio-group-dialog component demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module">
    import "@dile/ui/components/radio-group/radio-group-dialog.js";
    import { LitElement, html, css } from 'lit';

    // Example 1: Basic Dialog
    class ExampleOne extends LitElement {
      render() {
        return html`
          <dile-radio-group-dialog
            name="plan"
            title="Select Your Plan"
            description="Choose the plan that best fits your needs"
            .dialogItems=${[
              { value: 'basic', label: 'Basic Plan' },
              { value: 'pro', label: 'Pro Plan' },
              { value: 'enterprise', label: 'Enterprise Plan' }
            ]}
          ></dile-radio-group-dialog>
        `;
      }
    }
    customElements.define('dile-radio-dialog-example-one', ExampleOne);

    // Example 2: Dialog with Descriptions
    class ExampleTwo extends LitElement {
      render() {
        return html`
          <dile-radio-group-dialog
            name="service"
            title="Choose a Service"
            description="Select the service that meets your requirements"
            .dialogItems=${[
              { 
                value: 'standard', 
                label: 'Standard Support',
                description: 'Email support within 48 hours'
              },
              { 
                value: 'priority', 
                label: 'Priority Support',
                description: 'Phone and email support with 4-hour response time'
              },
              { 
                value: 'vip', 
                label: 'VIP Support',
                description: '24/7 dedicated support with guaranteed 1-hour response'
              }
            ]}
          ></dile-radio-group-dialog>
        `;
      }
    }
    customElements.define('dile-radio-dialog-example-two', ExampleTwo);

    // Example 3: With Initial Value
    class ExampleThree extends LitElement {
      render() {
        return html`
          <dile-radio-group-dialog
            name="frequency"
            value="monthly"
            title="Billing Frequency"
            .dialogItems=${[
              { value: 'monthly', label: 'Monthly Billing' },
              { value: 'quarterly', label: 'Quarterly Billing' },
              { value: 'annual', label: 'Annual Billing' }
            ]}
          ></dile-radio-group-dialog>
        `;
      }
    }
    customElements.define('dile-radio-dialog-example-three', ExampleThree);

    // Example 4: Disabled Dialog
    class ExampleFour extends LitElement {
      render() {
        return html`
          <dile-radio-group-dialog
            disabled
            name="disabled-demo"
            title="This Dialog is Disabled"
            description="You cannot select any option here"
            .dialogItems=${[
              { value: 'opt1', label: 'Option 1' },
              { value: 'opt2', label: 'Option 2' }
            ]}
          ></dile-radio-group-dialog>
        `;
      }
    }
    customElements.define('dile-radio-dialog-example-four', ExampleFour);

    // Example 5: Styled Dialog
    class ExampleFive extends LitElement {
      static styles = css`
        .styled-dialog {
          --dile-radio-group-dialog-title-color: #0c758c;
          --dile-radio-group-dialog-title-font-weight: 700;
          --dile-radio-group-dialog-item-label-color: #288ea5;
          --dile-radio-group-dialog-item-label-font-weight: 600;
          --dile-radio-group-dialog-item-description-color: #555555;
          --dile-card-background-color: #f9f9f9;
          --dile-card-border: 2px solid #0c758c;
          --dile-radio-icon-color: #20e073;
          --dile-radio-selected-icon-color: #0c758c;
        }
      `;

      render() {
        return html`
          <dile-radio-group-dialog
            class="styled-dialog"
            name="theme"
            title="Select Your Theme"
            description="Customize your interface appearance"
            .dialogItems=${[
              { 
                value: 'light', 
                label: 'Light Theme',
                description: 'Bright and clean interface'
              },
              { 
                value: 'dark', 
                label: 'Dark Theme',
                description: 'Easy on the eyes in low-light environments'
              },
              { 
                value: 'auto', 
                label: 'Auto (System Default)',
                description: 'Follows your system preferences'
              }
            ]}
          ></dile-radio-group-dialog>
        `;
      }
    }
    customElements.define('dile-radio-dialog-example-five', ExampleFive);

    // Example 6: Errored State
    class ExampleSix extends LitElement {
      render() {
        return html`
          <dile-radio-group-dialog
            errored
            hideErrorOnInput
            message="Please select a valid option"
            name="error-demo"
            title="Select an Option"
            .dialogItems=${[
              { value: 'a', label: 'Option A' },
              { value: 'b', label: 'Option B' }
            ]}
          ></dile-radio-group-dialog>
        `;
      }
    }
    customElements.define('dile-radio-dialog-example-six', ExampleSix);
  </script>
  <style>
    .demo-container {
      margin-bottom: 3rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>dile-radio-group-dialog component</h1>
    
    <h2>Basic Dialog</h2>
    <div class="demo-container">
      <dile-radio-dialog-example-one></dile-radio-dialog-example-one>
    </div>

    <h2>Dialog with Descriptions</h2>
    <div class="demo-container">
      <dile-radio-dialog-example-two></dile-radio-dialog-example-two>
    </div>

    <h2>With Initial Value</h2>
    <div class="demo-container">
      <dile-radio-dialog-example-three></dile-radio-dialog-example-three>
    </div>

    <h2>Disabled Dialog</h2>
    <div class="demo-container">
      <dile-radio-dialog-example-four></dile-radio-dialog-example-four>
    </div>

    <h2>Styled Dialog</h2>
    <div class="demo-container">
      <dile-radio-dialog-example-five></dile-radio-dialog-example-five>
    </div>

    <h2>Errored State</h2>
    <div class="demo-container">
      <dile-radio-dialog-example-six></dile-radio-dialog-example-six>
    </div>

    <footer><a href="../index.html">Back</a></footer>

  </div>
</body>
</html>
