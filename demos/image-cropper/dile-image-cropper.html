<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dile-image-cropper component demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module">
    import "@dile/image-cropper/image-cropper.js";

    const avatarCropper = document.getElementById('avatarCropper');
    const preview = document.getElementById('preview');
    const info = document.getElementById('info');

    document.getElementById('fileInput').addEventListener('change', (e) => {
      avatarCropper.file = e.target.files[0] || null;
    });

    document.getElementById('cropButton').addEventListener('click', async () => {
      const file = await avatarCropper.getFile();
      preview.src = URL.createObjectURL(file);
      info.textContent = `${file.name} · ${file.type} · ${file.size} bytes`;
    });

    document.getElementById('freeCropper').addEventListener('dile-image-cropper-change', (e) => {
      const { x, y, width, height } = e.detail;
      document.getElementById('selection').textContent =
        `x: ${Math.round(x)}, y: ${Math.round(y)}, width: ${Math.round(width)}, height: ${Math.round(height)}`;
    });
  </script>
  <style>
    .result {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    #preview {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #eee;
    }
    .tall {
      --dile-image-cropper-height: 450px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>dile-image-cropper</h1>

    <h2>Free crop</h2>
    <dile-image-cropper id="freeCropper" src="../images/random-user-21.jpg"></dile-image-cropper>
    <p id="selection"></p>

    <h2>Avatar crop (1:1, round mask, 256x256 output)</h2>
    <p><input type="file" id="fileInput" accept="image/*"></p>
    <dile-image-cropper
      id="avatarCropper"
      class="tall"
      aspectRatio="1"
      outputWidth="256"
      outputHeight="256"
      outputType="image/jpeg"
      round
    ></dile-image-cropper>
    <div class="result">
      <button id="cropButton">Crop</button>
      <img id="preview" alt="">
      <span id="info"></span>
    </div>

    <footer><a href="../index.html">Back</a></footer>
  </div>
</body>
</html>
