<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dile-material-icon demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module">
    import '@dile/iconlib/material-icons/home.js';
    import '@dile/iconlib/material-icons/3d-rotation.js';
    import '@dile/iconlib/material-icons/10k.js';
    import '@dile/iconlib/material-icons/star.js';
    import '@dile/iconlib/material-icons/check-box.js';
    import '@dile/iconlib/material-icons/favorite.js';
    import '@dile/iconlib/dile-material-icon.js';
  </script>
  <style>
   .styled {
    --dile-icon-color: red;
    --dile-icon-size: 32px;
   }
   .styled2 {
    --dile-icon-color: blue;
    --dile-icon-size: 48px;
   }
   dile-material-icon {
      --dile-icon-color: orange;
      --dile-icon-size: 48px;
   }
  </style>
</head>
<body>
  <div class="container">
    <h1>dile-material-icon</h1>

    <h2>Icon demos</h2>
    <p>
      <dile-material-icon-home></dile-material-icon-home>
      <dile-material-icon-3d-rotation></dile-material-icon-3d-rotation>
      <dile-material-icon-10k></dile-material-icon-10k>
      <dile-material-icon-check-box></dile-material-icon-check-box>
    </p>

    <h2>Styled demos</h2>
    <p>
      <dile-material-icon-star class="styled"></dile-material-icon-star>
      <dile-material-icon-favorite class="styled2"></dile-material-icon-favorite>
    </p>

    <h2>Icon by name</h2>
    <p>
      <dile-material-icon icon="home"></dile-material-icon>
      <dile-material-icon icon="star"></dile-material-icon>
    </p>

    <footer><a href="./index.html">Back</a></footer>
  </div>
</body>
</html>
