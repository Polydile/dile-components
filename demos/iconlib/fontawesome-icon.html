<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dile-fontawesome-icon demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module">
    import '@dile/iconlib/fontawesome-icons/xbox.js';
    import '@dile/iconlib/fontawesome-icons/11ty.js';
    import '@dile/iconlib/fontawesome-icons/airbnb.js';
    import '@dile/iconlib/fontawesome-icons/amazon.js';
    import '@dile/iconlib/fontawesome-icons/google.js';
    import '@dile/iconlib/fontawesome-icons/facebook.js';
    import '@dile/iconlib/fontawesome-icons/user.js';
    import '@dile/iconlib/fontawesome-icons/regular-angry.js';
    import '@dile/iconlib/fontawesome-icons/regular-home.js';
    import '@dile/iconlib/fontawesome-icons/mobile.js';
    import '@dile/iconlib/fontawesome-icons/github.js';
    import '@dile/iconlib/fontawesome-icons/linkedin.js';
    import '@dile/iconlib/fontawesome-icons/youtube.js';
    import '@dile/iconlib/fontawesome-icons/instagram.js';
    import '@dile/iconlib/fontawesome-icons/twitter.js';
    import '@dile/iconlib/fontawesome-icons/spotify.js';
    import '@dile/iconlib/fontawesome-icons/discord.js';
    import '@dile/iconlib/fontawesome-icons/whatsapp.js';
    import '@dile/iconlib/fontawesome-icons/docker.js';
    import '@dile/iconlib/fontawesome-icons/python.js';
    import '@dile/iconlib/fontawesome-icons/wordpress.js';
    import '@dile/iconlib/fontawesome-icons/tiktok.js';
    import '@dile/iconlib/dile-fontawesome-icon.js';
  </script>
  <style>
   .styled {
    --dile-icon-color: red;
    --dile-icon-size: 32px;
   }
   .styled2 {
    --dile-icon-color: blue;
    --dile-icon-size: 48px;
   }
   dile-fontawesome-icon {
      --dile-icon-color: brown;
      --dile-icon-size: 18px;
   }
  </style>
</head>
<body>
  <div class="container">
    <h1>dile-fontawesome-icon</h1>

    <h2>Icon demos</h2>
    <p>
      <dile-fontawesome-icon-xbox></dile-fontawesome-icon-xbox>
      <dile-fontawesome-icon-amazon></dile-fontawesome-icon-amazon>
      <dile-fontawesome-icon-user></dile-fontawesome-icon-user>
      <dile-fontawesome-icon-regular-angry></dile-fontawesome-icon-regular-angry>
    </p>

    <h2>Styled Icon demos</h2>
    <p>
      <dile-fontawesome-icon-airbnb class="styled"></dile-fontawesome-icon-airbnb>
      <dile-fontawesome-icon-11ty class="styled2"></dile-fontawesome-icon-11ty>
      <dile-fontawesome-icon-user class="styled"></dile-fontawesome-icon-user>
      <dile-fontawesome-icon-regular-angry class="styled2"></dile-fontawesome-icon-regular-angry>
    </p>

    <h2>Icon by name</h2>
    <p>
      <dile-fontawesome-icon icon="facebook"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="facebook"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="google"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="regular-home"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="mobile"></dile-fontawesome-icon>
    </p>

    <h2>Brand icon demos</h2>
    <p>
      <dile-fontawesome-icon-github></dile-fontawesome-icon-github>
      <dile-fontawesome-icon-linkedin></dile-fontawesome-icon-linkedin>
      <dile-fontawesome-icon-youtube></dile-fontawesome-icon-youtube>
      <dile-fontawesome-icon-instagram></dile-fontawesome-icon-instagram>
      <dile-fontawesome-icon-twitter></dile-fontawesome-icon-twitter>
      <dile-fontawesome-icon-spotify></dile-fontawesome-icon-spotify>
      <dile-fontawesome-icon-discord></dile-fontawesome-icon-discord>
      <dile-fontawesome-icon-whatsapp></dile-fontawesome-icon-whatsapp>
      <dile-fontawesome-icon-docker></dile-fontawesome-icon-docker>
      <dile-fontawesome-icon-python></dile-fontawesome-icon-python>
      <dile-fontawesome-icon-wordpress></dile-fontawesome-icon-wordpress>
      <dile-fontawesome-icon-tiktok></dile-fontawesome-icon-tiktok>
    </p>

    <h2>Brand icon demos, styled</h2>
    <p>
      <dile-fontawesome-icon-github class="styled"></dile-fontawesome-icon-github>
      <dile-fontawesome-icon-linkedin class="styled2"></dile-fontawesome-icon-linkedin>
      <dile-fontawesome-icon-spotify class="styled"></dile-fontawesome-icon-spotify>
      <dile-fontawesome-icon-whatsapp class="styled2"></dile-fontawesome-icon-whatsapp>
    </p>

    <h2>Brand icon by name</h2>
    <p>
      <dile-fontawesome-icon icon="github"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="twitter"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="docker"></dile-fontawesome-icon>
      <dile-fontawesome-icon icon="tiktok"></dile-fontawesome-icon>
    </p>

    <footer><a href="./index.html">Back</a></footer>
  </div>
</body>
</html>
