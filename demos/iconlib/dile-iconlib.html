<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dile-iconlib demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module">
    import '@dile/iconlib/lucide-icons/house.js';
    import '@dile/iconlib/lucide-icons/dribbble.js';
    import '@dile/iconlib/lucide-icons/bird.js';
    import '@dile/iconlib/material-icons/receipt.js';
    import '@dile/iconlib/material-icons/star.js';
    import '@dile/iconlib/material-icons/favorite.js';
    import '@dile/iconlib/fontawesome-icons/microsoft.js';
    import '@dile/iconlib/fontawesome-icons/google.js';
    import '@dile/iconlib/fontawesome-icons/airbnb.js';
    import '@dile/iconlib/dile-iconlib.js';
  </script>
  <style>
   dile-iconlib {
      --dile-icon-color: purple;
      --dile-icon-size: 32px;
   }
   .styled {
    --dile-icon-color: red;
    --dile-icon-size: 32px;
   }
   .styled2 {
    --dile-icon-color: blue;
    --dile-icon-size: 48px;
   }
   .styled3 {
    --dile-icon-color: green;
    --dile-icon-size: 24px;
    --dile-icon-rounded-background-color: #d7f5dd;
   }
   .icon-row {
    display: flex;
    align-items: center;
    gap: 1rem;
   }
  </style>
</head>
<body>
  <div class="container">
    <h1>dile-iconlib</h1>

    <h2>Icon by compound name (family.icon)</h2>
    <p>
      <dile-iconlib icon="lucide.house"></dile-iconlib>
      <dile-iconlib icon="material.receipt"></dile-iconlib>
      <dile-iconlib icon="fontawesome.microsoft"></dile-iconlib>
    </p>

    <h2>Rounded</h2>
    <p>
      <dile-iconlib icon="lucide.house" rounded></dile-iconlib>
    </p>

    <h2>Styled demos (mixed libraries, custom color/size)</h2>
    <p class="icon-row">
      <dile-iconlib icon="lucide.dribbble" class="styled"></dile-iconlib>
      <dile-iconlib icon="material.star" class="styled2"></dile-iconlib>
      <dile-iconlib icon="fontawesome.airbnb" class="styled"></dile-iconlib>
      <dile-iconlib icon="lucide.bird" class="styled3" rounded></dile-iconlib>
      <dile-iconlib icon="material.favorite" class="styled3" rounded></dile-iconlib>
      <dile-iconlib icon="fontawesome.google" class="styled2"></dile-iconlib>
    </p>

    <h2>Default icon (no "icon" attribute)</h2>
    <p>
      <dile-iconlib></dile-iconlib>
    </p>

    <h2>Unknown family (expect console warning, nothing rendered)</h2>
    <p>
      <dile-iconlib icon="bogus.thing"></dile-iconlib>
    </p>

    <footer><a href="./index.html">Back</a></footer>
  </div>
</body>
</html>
